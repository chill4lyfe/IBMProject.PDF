services:
  backend:
    build:
      context: ./Backend
    container_name: notebook-backend
    ports:
      - "8000:8000"
    env_file:
      - ./Backend/.env
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./Backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./Frontend
    container_name: notebook-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./Frontend:/app
      - /app/node_modules

  mongo:
    image: mongodb/mongodb-atlas-local:latest
    container_name: local-mongo
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5